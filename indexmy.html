<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Места, куда хочется вернуться — фотогалерея</title>
  <meta name="description" content="Фотогалерея путешествий: неоновый Токио, тихие переулки Киото и синий час на побережье Венеции. Восемь кадров, которые хочется пересматривать.">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233858D6'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='white'/%3E%3C/svg%3E">

  <style>
    :root {
        --bg-deep: #0b1220;
        --bg-mid: #13213c;
        --card: rgba(15, 23, 42, 0.78);
        --card-border: rgba(125, 211, 252, 0.18);
        --text: #e8eefc;
        --muted: #93a4c3;
        --accent1: #22d3ee;
        --accent2: #818cf8;
        --accent3: #f0abfc;
        --glow: rgba(129, 140, 248, 0.45);
        --per-view: 3;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px 16px;
        overflow-x: hidden;
        background:
            radial-gradient(900px 480px at 12% -8%, rgba(34, 211, 238, 0.12), transparent 60%),
            radial-gradient(1000px 520px at 92% 112%, rgba(129, 140, 248, 0.16), transparent 60%),
            linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
        background-attachment: fixed;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        line-height: 1.5;
    }

    .card {
        width: 100%;
        max-width: 980px;
        padding: 32px 24px 24px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        box-shadow:
            0 24px 60px rgba(2, 6, 23, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        max-height: 95vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .slider {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .viewport {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        border-radius: 14px;
    }

    .track {
        display: flex;
        margin: 0;
        padding: 0;
        list-style: none;
        transition: transform 0.45s ease-in-out;
    }

    .slide {
        flex: 0 0 calc(100% / var(--per-view));
        padding: 0 6px;
    }

    .slide img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        max-height: 55vh;
        object-fit: cover;
        border-radius: 14px;
        user-select: none;
        -webkit-user-drag: none;
        box-shadow: 0 8px 22px rgba(2, 6, 23, 0.45);
        border: 1px solid rgba(125, 211, 252, 0.12);
        color: var(--muted);
        font-size: 14px;
        text-align: center;
    }

    /* Заглушки под фотографии: видны, пока файлы 1.jpg…8.jpg не добавлены */
    .slide:nth-child(3n + 1) img {
        background: linear-gradient(150deg, #164e63, #312e81);
    }
    .slide:nth-child(3n + 2) img {
        background: linear-gradient(150deg, #4c1d95, #831843);
    }
    .slide:nth-child(3n + 3) img {
        background: linear-gradient(150deg, #0e7490, #1e1b4b);
    }

    .arrow {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(145deg, var(--accent1), var(--accent2));
        border: none;
        border-radius: 50%;
        transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
        z-index: 10;
    }

    .arrow:hover {
        transform: scale(1.08);
        filter: brightness(1.1);
        box-shadow: 0 6px 18px var(--glow);
    }

    .arrow:focus-visible, .dot:focus-visible {
        outline: 3px solid var(--accent1);
        outline-offset: 2px;
    }

    .arrow svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .pager {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
    }

    .dots {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    .dot {
        width: 14px;
        height: 14px;
        padding: 0;
        cursor: pointer;
        background: rgba(148, 163, 184, 0.28);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 50%;
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .dot:hover {
        background: rgba(148, 163, 184, 0.5);
    }

    .dot.active {
        background: linear-gradient(145deg, var(--accent1), var(--accent2));
        border-color: transparent;
        transform: scale(1.25);
        box-shadow: 0 4px 12px var(--glow);
    }

    .main-footer {
        color: rgba(232, 238, 252, 0.75);
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        text-shadow: 0 1px 4px rgba(2, 6, 23, 0.5);
        width: 100%;
    }

    .main-footer p {
        margin: 0;
    }

    @media (max-width: 600px) {
        :root {
            --per-view: 1;
        }
        .card {
            padding: 24px 12px 20px;
        }
        .slider {
            gap: 6px;
        }
        .arrow {
            width: 38px;
            height: 38px;
        }
        .slide img {
            max-height: 45vh;
        }
    }
  </style>
</head>
<body>

    <main class="card">
        <!-- Фотографии подключаются как 1.png … 7.png рядом с этим файлом -->
        <section id="gallery" class="slider" aria-label="Галерея изображений">
            <button type="button" class="arrow" id="prev" aria-label="Назад">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"></path></svg>
            </button>

            <div class="viewport" id="viewport">
                <div class="track" id="track">
                    <div class="slide"><img src="1.png" alt="Фото 1"></div>
                    <div class="slide"><img src="2.png" alt="Фото 2"></div>
                    <div class="slide"><img src="3.png" alt="Фото 3"></div>
                    <div class="slide"><img src="4.png" alt="Фото 4"></div>
                    <div class="slide"><img src="5.png" alt="Фото 5"></div>
                    <div class="slide"><img src="6.png" alt="Фото 6"></div>
                    <div class="slide"><img src="7.png" alt="Фото 7"></div>
                </div>
            </div>

            <button type="button" class="arrow" id="next" aria-label="Вперёд">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"></path></svg>
            </button>
        </section>

        <nav class="pager" aria-label="Страницы галереи">
            <div class="dots" id="dots"></div>
        </nav>
    </main>

    <footer class="main-footer">
        <p>© Губанов Кирилл</p>
    </footer>

    <script>
        "use strict";

        document.addEventListener("DOMContentLoaded", function () {
            const phoneQuery = window.matchMedia("(max-width: 600px)");
            const track = document.getElementById("track");
            const viewport = document.getElementById("viewport");
            const prevButton = document.getElementById("prev");
            const nextButton = document.getElementById("next");
            const dotsBox = document.getElementById("dots");

            // Все слайды галереи
            const slides = track.children;
            const total = slides.length;
            let currentPageIndex = 0;

            function getPerView() {
                return phoneQuery.matches ? 1 : 3;
            }

            function getPageCount() {
                return Math.ceil(total / getPerView());
            }

            function render() {
                const perView = getPerView();
                // Ограничиваем индекс, чтобы не улететь в пустоту
                const startIndex = Math.min(currentPageIndex * perView, total - perView);

                // Высчитываем точный сдвиг в пикселях
                const shiftPx = startIndex * (viewport.offsetWidth / perView);

                // Сдвигаем ленту
                track.style.transform = "translateX(-" + shiftPx + "px)";

                // Обновляем точки
                const dots = dotsBox.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle("active", i === currentPageIndex);
                }
            }

            function goToPage(pageNumber) {
                const count = getPageCount();
                // Зацикливаем
                if (pageNumber < 0) {
                    currentPageIndex = count - 1;
                } else if (pageNumber >= count) {
                    currentPageIndex = 0;
                } else {
                    currentPageIndex = pageNumber;
                }
                render();
            }

            function buildDots() {
                dotsBox.innerHTML = "";
                const count = getPageCount();
                for (let i = 0; i < count; i++) {
                    const dot = document.createElement("button");
                    dot.type = "button";
                    dot.className = "dot";
                    dot.setAttribute("aria-label", "Страница " + (i + 1));
                    if (i === 0) dot.classList.add("active");

                    dot.addEventListener("click", function () {
                        goToPage(i);
                    });
                    dotsBox.appendChild(dot);
                }
            }

            prevButton.addEventListener("click", function () {
                goToPage(currentPageIndex - 1);
            });

            nextButton.addEventListener("click", function () {
                goToPage(currentPageIndex + 1);
            });

            // Свайпы для тачскринов
            let startX = null;
            viewport.addEventListener("pointerdown", function (e) {
                startX = e.clientX;
            });
            viewport.addEventListener("pointerup", function (e) {
                if (startX !== null && Math.abs(e.clientX - startX) > 40) {
                    if (e.clientX < startX) {
                        goToPage(currentPageIndex + 1);
                    } else {
                        goToPage(currentPageIndex - 1);
                    }
                }
                startX = null;
            });

            // Пересчет при ресайзе окна
            window.addEventListener("resize", function () {
                // При изменении размера сбрасываем на 1 страницу, чтобы не было багов
                currentPageIndex = 0;
                buildDots();
                render();
            });

            // Запускаем
            buildDots();

            // Небольшая задержка перед первым рендером, чтобы браузер успел отрисовать размеры
            setTimeout(render, 50);
        });
    </script>
</body>
</html>
